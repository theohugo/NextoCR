# Modified by the NextoCR project from the Apache-2.0 crforge distribution metadata.
[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nextocr-gym"
version = "0.1.0"
description = "Gymnasium environment for the offline NextoCR self-play research simulator"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "gymnasium>=0.29.0",
    "numpy>=1.24.0",
    "pyzmq>=25.0.0",
]

[project.optional-dependencies]
train = [
    "stable-baselines3>=2.3.0",
    "sb3-contrib>=2.3.0",
    "tensorboard>=2.14.0",
]
jpype = [
    "jpype1>=1.5.0",
]
dev = [
    "stable-baselines3>=2.3.0",
    "sb3-contrib>=2.3.0",
    "tensorboard>=2.14.0",
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["crforge_gym*", "nextocr_gym*"]

[project.urls]
Homepage = "https://github.com/theohugo/NextoCR"
Repository = "https://github.com/theohugo/NextoCR"
Issues = "https://github.com/theohugo/NextoCR/issues"
